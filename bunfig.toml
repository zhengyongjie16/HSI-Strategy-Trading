[test]
root = "tests"
preload = ["./tests/setup/testRuntime.ts"]

[fmt]
semi = true
singleQuote = true
tabWidth = 2
trailingComma = "all"
endOfLine = "lf"
printWidth = 100
bracketSpacing = true
arrowParens = "always"
quoteProps = "as-needed"
jsxSingleQuote = false

[[fmt.overrides]]
files = ["*.md"]
options = { proseWrap = "never" }
